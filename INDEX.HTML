<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Circular Buffer Interactive Visualizer</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Fira+Code:wght@500&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc; /* Tailwind slate-50 */
            color: #0f172a; /* Tailwind slate-900 */
        }
        
        .code-font {
            font-family: 'Fira Code', monospace;
        }

        /* SVG animation transitions */
        .node-circle {
            transition: fill 0.3s ease, stroke 0.3s ease;
        }
        
        .node-text {
            transition: opacity 0.3s ease;
        }

        .pointer-group {
            /* Smooth rotation for the pointers */
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform-origin: 250px 250px;
        }

        /* Custom toast notification styling */
        #toast {
            transition: opacity 0.3s ease, transform 0.3s ease;
            z-index: 50;
        }
        .toast-hidden {
            opacity: 0;
            transform: translate(-50%, -20px);
            pointer-events: none;
        }
        .toast-visible {
            opacity: 1;
            transform: translate(-50%, 0);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center py-10 px-4">

    <div id="toast" class="toast-hidden fixed top-6 left-1/2 bg-red-600 text-white px-6 py-3 rounded-lg shadow-lg font-semibold flex items-center gap-2">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
        <span id="toast-message">Error message</span>
    </div>

    <header class="text-center mb-8 max-w-2xl">
        <h1 class="text-3xl font-bold mb-2">Circular Buffer (Ring Buffer)</h1>
        <p class="text-slate-500">Interactive modulo arithmetic visualization for continuous data streams.</p>
    </header>

    <div class="flex flex-col md:flex-row gap-8 items-start w-full max-w-5xl justify-center">
        
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex-shrink-0 relative">
            <svg id="buffer-svg" viewBox="0 0 500 500" class="w-[400px] h-[400px] md:w-[500px] md:h-[500px]">
                <!-- Defs for arrowheads -->
                <defs>
                    <marker id="head-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
                        <path d="M 0 2 L 8 5 L 0 8 Z" fill="#10b981" /> <!-- Emerald-500 -->
                    </marker>
                    <marker id="tail-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
                        <path d="M 0 2 L 8 5 L 0 8 Z" fill="#ef4444" /> <!-- Red-500 -->
                    </marker>
                </defs>

                <!-- Center Hub -->
                <circle cx="250" cy="250" r="75" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
                <text x="250" y="235" text-anchor="middle" class="text-xs fill-slate-400 font-semibold tracking-widest">MODULO MATH</text>
                <text id="math-display" x="250" y="260" text-anchor="middle" class="code-font text-lg fill-slate-800 font-bold">(0 + 1) % 8</text>
                <text id="status-display" x="250" y="285" text-anchor="middle" class="text-sm fill-blue-600 font-semibold">Empty</text>

                <!-- Ring Track (Dashed line) -->
                <circle cx="250" cy="250" r="140" fill="none" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="6 6"/>

                <!-- Nodes Group (Injected via JS) -->
                <g id="nodes-group"></g>

                <!-- Head Pointer (Read) - Points outwards from center -->
                <g id="head-ptr" class="pointer-group" style="transform: rotate(0deg);">
                    <line x1="250" y1="250" x2="250" y2="150" stroke="#10b981" stroke-width="3" marker-end="url(#head-arrow)" />
                    <rect x="220" y="165" width="60" height="24" rx="12" fill="#d1fae5" stroke="#10b981" stroke-width="1.5" />
                    <text x="250" y="181" text-anchor="middle" class="text-xs font-bold fill-emerald-700">HEAD</text>
                </g>

                <!-- Tail Pointer (Write) - Points inwards from outside -->
                <g id="tail-ptr" class="pointer-group" style="transform: rotate(0deg);">
                    <line x1="250" y1="50" x2="250" y2="85" stroke="#ef4444" stroke-width="3" marker-end="url(#tail-arrow)" />
                    <rect x="220" y="20" width="60" height="24" rx="12" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5" />
                    <text x="250" y="36" text-anchor="middle" class="text-xs font-bold fill-red-700">TAIL</text>
                </g>
            </svg>
        </div>

        <div class="flex flex-col gap-6 w-full max-w-sm">
            
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                <h2 class="text-lg font-bold mb-4">Controls</h2>
                <div class="flex flex-col gap-3">
                    <button onclick="enqueue()" id="btn-enqueue" class="w-full py-3 px-4 bg-slate-900 hover:bg-slate-800 text-white rounded-xl font-semibold transition-colors flex justify-between items-center group">
                        <span>Enqueue (Write)</span>
                        <span class="bg-slate-700 text-slate-200 text-xs py-1 px-2 rounded-lg group-hover:bg-slate-600">Tail + 1</span>
                    </button>
                    <button onclick="dequeue()" id="btn-dequeue" class="w-full py-3 px-4 bg-white hover:bg-slate-50 text-slate-700 border-2 border-slate-200 rounded-xl font-semibold transition-colors flex justify-between items-center group">
                        <span>Dequeue (Read)</span>
                        <span class="bg-slate-100 text-slate-500 text-xs py-1 px-2 rounded-lg group-hover:bg-slate-200">Head + 1</span>
                    </button>
                    <button onclick="resetBuffer()" class="w-full mt-2 py-2 px-4 text-slate-500 hover:text-slate-800 font-medium underline text-sm transition-colors">
                        Reset Buffer
                    </button>
                </div>
            </div>

            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                <h2 class="text-lg font-bold mb-4">Memory State</h2>
                <div class="grid grid-cols-2 gap-4">
                    <div class="p-3 bg-emerald-50 rounded-xl border border-emerald-100">
                        <div class="text-emerald-600 text-xs font-bold uppercase mb-1">Head Index</div>
                        <div class="code-font text-2xl font-bold text-emerald-700" id="val-head">0</div>
                    </div>
                    <div class="p-3 bg-red-50 rounded-xl border border-red-100">
                        <div class="text-red-600 text-xs font-bold uppercase mb-1">Tail Index</div>
                        <div class="code-font text-2xl font-bold text-red-700" id="val-tail">0</div>
                    </div>
                    <div class="p-3 bg-slate-50 rounded-xl border border-slate-200 col-span-2 flex justify-between items-center">
                        <div class="text-slate-500 text-sm font-bold uppercase">Occupancy</div>
                        <div class="code-font text-xl font-bold text-slate-800"><span id="val-size">0</span> / 8</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const CAPACITY = 8;
        let buffer = new Array(CAPACITY).fill(null);
        let head = 0;
        let tail = 0;
        let size = 0;
        let dataCounter = 1;

        // Constants for SVG drawing
        const CX = 250;
        const CY = 250;
        const RADIUS = 140;

        // Elements
        const nodesGroup = document.getElementById('nodes-group');
        const headPtr = document.getElementById('head-ptr');
        const tailPtr = document.getElementById('tail-ptr');
        const mathDisplay = document.getElementById('math-display');
        const statusDisplay = document.getElementById('status-display');
        
        // Initialize SVG Nodes
        function initSVG() {
            nodesGroup.innerHTML = '';
            for (let i = 0; i < CAPACITY; i++) {
                // Calculate position. -90 degrees puts index 0 at the top (12 o'clock)
                const angle = (i * (360 / CAPACITY) - 90) * (Math.PI / 180);
                const x = CX + RADIUS * Math.cos(angle);
                const y = CY + RADIUS * Math.sin(angle);

                // Create group for each slot
                const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
                
                // Outer circle for the slot
                const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                circle.setAttribute('cx', x);
                circle.setAttribute('cy', y);
                circle.setAttribute('r', 25);
                circle.setAttribute('id', `node-circle-${i}`);
                circle.setAttribute('class', 'node-circle');
                circle.setAttribute('fill', '#ffffff');
                circle.setAttribute('stroke', '#cbd5e1');
                circle.setAttribute('stroke-width', '2');
                
                // Text inside the slot (Data)
                const textData = document.createElementNS("http://www.w3.org/2000/svg", "text");
                textData.setAttribute('x', x);
                textData.setAttribute('y', y + 6);
                textData.setAttribute('text-anchor', 'middle');
                textData.setAttribute('id', `node-text-${i}`);
                textData.setAttribute('class', 'code-font font-bold text-slate-800 node-text');
                textData.textContent = ''; // Empty initially

                // Small index label outside the slot
                const textIdx = document.createElementNS("http://www.w3.org/2000/svg", "text");
                const idxRadius = RADIUS + 40;
                const idxX = CX + idxRadius * Math.cos(angle);
                const idxY = CY + idxRadius * Math.sin(angle) + 4;
                textIdx.setAttribute('x', idxX);
                textIdx.setAttribute('y', idxY);
                textIdx.setAttribute('text-anchor', 'middle');
                textIdx.setAttribute('class', 'code-font text-xs fill-slate-400');
                textIdx.textContent = `[${i}]`;

                g.appendChild(circle);
                g.appendChild(textData);
                g.appendChild(textIdx);
                nodesGroup.appendChild(g);
            }
        }

        function updateUI() {
            // 1. Update nodes based on buffer array
            for (let i = 0; i < CAPACITY; i++) {
                const circle = document.getElementById(`node-circle-${i}`);
                const text = document.getElementById(`node-text-${i}`);
                
                if (buffer[i] !== null) {
                    // Node is filled
                    circle.setAttribute('fill', '#dbeafe'); // blue-100
                    circle.setAttribute('stroke', '#3b82f6'); // blue-500
                    circle.setAttribute('stroke-width', '3');
                    text.textContent = buffer[i];
                } else {
                    // Node is empty
                    circle.setAttribute('fill', '#ffffff');
                    circle.setAttribute('stroke', '#cbd5e1');
                    circle.setAttribute('stroke-width', '2');
                    text.textContent = '';
                }
            }

            // 2. Rotate pointers (0 degrees is at the top)
            // Multiply index by 45 degrees (360 / 8)
            headPtr.style.transform = `rotate(${head * 45}deg)`;
            tailPtr.style.transform = `rotate(${tail * 45}deg)`;

            // 3. Update dashboard text
            document.getElementById('val-head').textContent = head;
            document.getElementById('val-tail').textContent = tail;
            document.getElementById('val-size').textContent = size;

            // 4. Update central Hub math and status
            mathDisplay.textContent = `(${tail} + 1) % 8`;
            
            let status = 'Partially Full';
            let statusColor = 'fill-blue-600';
            
            if (size === 0) {
                status = 'Empty (Wait for Write)';
                statusColor = 'fill-slate-500';
            } else if (size === CAPACITY) {
                status = 'Full (Buffer Maxed)';
                statusColor = 'fill-red-600';
            }
            
            statusDisplay.textContent = status;
            statusDisplay.setAttribute('class', `text-sm font-semibold ${statusColor}`);

            // Update button states
            document.getElementById('btn-enqueue').style.opacity = (size === CAPACITY) ? '0.5' : '1';
            document.getElementById('btn-dequeue').style.opacity = (size === 0) ? '0.5' : '1';
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-message').textContent = message;
            
            toast.classList.remove('toast-hidden');
            toast.classList.add('toast-visible');
            
            setTimeout(() => {
                toast.classList.remove('toast-visible');
                toast.classList.add('toast-hidden');
            }, 3000);
        }

        function enqueue() {
            if (size === CAPACITY) {
                showToast("Buffer Overflow! Cannot write to a full buffer.");
                return;
            }
            
            // Generate some dummy data (D1, D2, etc.)
            const data = "D" + dataCounter++;
            
            // Place data at the tail pointer
            buffer[tail] = data;
            
            // Advance tail using modulo arithmetic
            tail = (tail + 1) % CAPACITY;
            
            size++;
            updateUI();
        }

        function dequeue() {
            if (size === 0) {
                showToast("Buffer Underflow! Cannot read from an empty buffer.");
                return;
            }
            
            // Read data at the head pointer (and clear it for visual clarity)
            const data = buffer[head];
            buffer[head] = null;
            
            // Advance head using modulo arithmetic
            head = (head + 1) % CAPACITY;
            
            size--;
            updateUI();
        }

        function resetBuffer() {
            buffer = new Array(CAPACITY).fill(null);
            head = 0;
            tail = 0;
            size = 0;
            dataCounter = 1;
            updateUI();
        }

        // Initialize the app on load
        initSVG();
        updateUI();

    </script>
</body>
</html>
